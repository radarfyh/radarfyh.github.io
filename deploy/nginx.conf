# Same-origin GETs may omit Origin; preserve an explicitly supplied Origin for backend validation.
map $http_origin $inquiry_origin {
 default $http_origin;
 "" "$scheme://$http_host";
}
server {
 listen 8080;
 # Preserve the public host and NodePort when normalizing directory URLs.
 absolute_redirect off;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Robots-Tag "noindex, nofollow" always;
 location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
 location = /healthz { access_log off; return 200 'ok'; }
 location = /crm-commerce/mall/catalog {
  limit_except GET { deny all; }
  proxy_pass http://feng-crm-ui.feng-crm-s3.svc.cluster.local:8080;
  proxy_set_header Host $host;
 }
 location /crm-public/v1/website-inquiries {
  proxy_set_header Origin $inquiry_origin;
  proxy_pass http://feng-crm-ui.feng-crm-s3.svc.cluster.local:8080;
  proxy_set_header Host $host;
  client_max_body_size 32k;
 }
 location / { try_files $uri $uri/ =404; }
}
